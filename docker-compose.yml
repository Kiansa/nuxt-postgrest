# Shared local Postgres instance — one instance, any number of databases.
# A PostgREST API gets added per database in a separate file; see docker-compose.postgrest.yml.
# `pnpm db:up` brings up both together for dev/tests. `pnpm db:down` stops and wipes.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes:
      - ./db/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      retries: 20
